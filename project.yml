name: CampusSchedule
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CampusSchedule:
    type: application
    platform: iOS
    sources:
      - path: CampusSchedule/App
      - path: CampusSchedule/Shared
    resources:
      - path: CampusSchedule/Resources/schedule.json
      - path: CampusSchedule/Assets.xcassets
    info:
      path: CampusSchedule/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CampusSchedule
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CampusScheduleWidgetExtension
        embed: true

  CampusScheduleWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CampusScheduleWidget
        excludes:
          - Info.plist
      - path: CampusSchedule/Shared
    resources:
      - path: CampusSchedule/Resources/schedule.json
    info:
      path: CampusScheduleWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CampusSchedule.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  CampusScheduleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CampusScheduleTests
    resources:
      - path: CampusSchedule/Resources/schedule.json
    dependencies:
      - target: CampusSchedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CampusScheduleTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CampusSchedule.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CampusSchedule"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CampusSchedule:
    build:
      targets:
        CampusSchedule: all
        CampusScheduleWidgetExtension: all
    test:
      targets:
        - CampusScheduleTests
    run:
      config: Debug
    archive:
      config: Release
